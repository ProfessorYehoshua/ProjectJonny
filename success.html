<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Jonathan Papia</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --sage: #e8efe9; --teal: #2a7a74; --teal-light: #4ecdc4; --teal-btn: #3a8a84; --white: #ffffff; --text: #2c3e35; --muted: #6b7c74; --border: #c5d5c8; }
    html { scroll-behavior: smooth; }
    body { background: var(--sage); color: var(--text); font-family: 'Lato', sans-serif; font-weight: 300; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .card { background: var(--white); border-radius: 4px; border-top: 4px solid var(--teal-btn); padding: 4rem 3rem; max-width: 520px; width: 100%; box-shadow: 0 8px 30px rgba(42,122,116,0.1); }
    .logo { margin-bottom: 2rem; }
    .logo img { height: 70px; width: auto; }
    .tag { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.2em; color: var(--teal-btn); text-transform: uppercase; margin-bottom: 1rem; opacity: 0; animation: fadeUp 0.8s 0.2s forwards; }
    h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight: 400; color: var(--teal); line-height: 1.2; margin-bottom: 1.5rem; opacity: 0; animation: fadeUp 0.8s 0.3s forwards; }
    h1 em { font-style: italic; }
    .divider { width: 40px; height: 2px; background: var(--teal-light); margin: 0 auto 1.5rem; opacity: 0; animation: fadeUp 0.8s 0.4s forwards; }
    p { font-size: 0.95rem; color: var(--muted); line-height: 1.8; margin-bottom: 2rem; opacity: 0; animation: fadeUp 0.8s 0.5s forwards; }
    a.back { display: inline-block; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--white); background: var(--teal-btn); padding: 0.9rem 2rem; text-decoration: none; border-radius: 2px; transition: all 0.3s; opacity: 0; animation: fadeUp 0.8s 0.6s forwards; }
    a.back:hover { background: var(--teal); transform: translateY(-2px); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="logo.png" alt="Jonathan Papia Holistic Health" /></div>
    <div class="tag">Message Received</div>
    <h1>Thank You for<br /><em>Reaching Out</em></h1>
    <div class="divider"></div>
    <p>Jonathan will personally be in touch soon to schedule your free discovery call. Your healing journey has already begun.</p>
    <a href="/" class="back">Return Home</a>
  </div>
</body>
</html>
